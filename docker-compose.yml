version: '3.8'

services:
  # .NET API Application
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shoppefake-api
    environment:
      # ASP.NET Core settings
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080

      # Database connection - customize with your external PostgreSQL
      DefaultConnection: ${CONNECTIONSTRINGS__DEFAULTCONNECTION:-Server=localhost;Port=5432;Database=ShoppeFakeDB;User Id=postgres;Password=YourPasswordHere123!;}

      # JWT configuration
      Jwt__SecretKey: ${JWT__SECRETKEY:-your-secret-key-change-this-in-production}
      Jwt__Issuer: ${JWT__ISSUER:-ShoppeFakeAPI}
      Jwt__Audience: ${JWT__AUDIENCE:-ShoppeFakeClient}
      Jwt__ExpirationInMinutes: ${JWT__EXPIRATION:-60}

      # Email configuration (Mailgun or your SMTP)
      Email__SmtpServer: ${EMAIL__SMTPSERVER:-smtp.mailtrap.io}
      Email__SmtpPort: ${EMAIL__SMTPPORT:-2525}
      Email__SenderName: ${EMAIL__SENDERNAME:-ShoppeFake}
      Email__SenderEmail: ${EMAIL__SENDEREMAIL:-noreply@shoppefake.com}
      Email__Username: ${EMAIL__USERNAME:-}
      Email__Password: ${EMAIL__PASSWORD:-}

      # Cloudinary configuration
      Cloudinary__CloudName: ${CLOUDINARY__CLOUDNAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY__APIKEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY__APISECRET:-}
      # Chat APi Client
      ChatApi__BaseUrl: ${CHATAPI__BASEURL}
      ChatApi__Apikey: ${CHATAPI__APIKEY}

    ports:
      - "${API_PORT:-8080}:8080"
    networks:
      - shoppefake-network
    restart: unless-stopped
    # Uncomment the volumes below for development mode
    # volumes:
    #   - .:/app

networks:
  shoppefake-network:
    driver: bridge
